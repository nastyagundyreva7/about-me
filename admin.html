<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RUD Coins — Администратор</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body><main class="wrap"><div class="section-head"><div><div class="eyebrow">RUD COINS · ADMIN</div><h1>Панель администратора</h1><p class="small">Доступ разрешён только пользователю с ролью admin в базе данных.</p></div><button class="outline" onclick="logout()">Выйти</button></div><div id="adminNotice" class="notice">Проверяем авторизацию…</div><section id="dashboard" style="display:none"><div class="admin"><h2>Регистрации на мероприятия</h2><div id="regs"></div></div><div class="admin" style="margin-top:20px"><h2>Студенты</h2><div id="students"></div></div></section></main><script>
const cfg=window.RUDCOINS_CONFIG;const sb=cfg&&cfg.supabaseUrl&&cfg.supabaseAnonKey&&!cfg.supabaseUrl.includes('YOUR-')?supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey):null;
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function init(){if(!sb){return notice('Сначала укажите Supabase URL и anon key в config.js.')}const {data:{user}}=await sb.auth.getUser();if(!user)return location.href='index.html#login';const {data:p,error}=await sb.from('profiles').select('*').eq('id',user.id).single();if(error||!p||p.role!=='admin'){return notice('Доступ запрещён. Эта страница доступна только администратору.')}document.getElementById('adminNotice').remove();document.getElementById('dashboard').style.display='block';await load();}
function notice(t){document.getElementById('adminNotice').textContent=t}
async function load(){const {data:rows}=await sb.from('registrations').select('id,status,participation_level,coins_awarded,created_at,profiles(last_name,first_name,middle_name,student_group,rudn_email),events(title,event_date,category,base,level)').order('created_at',{ascending:false});document.getElementById('regs').innerHTML=(rows||[]).map(r=>`<div class="history"><div><b>${esc(r.profiles?.last_name)} ${esc(r.profiles?.first_name)}</b><small>${esc(r.profiles?.student_group)} · ${esc(r.profiles?.rudn_email)}</small><br>${esc(r.events?.title)} · база ${r.events?.base} · ${esc(r.events?.level)}</div><div><span>${esc(r.status)}</span><small>${esc(r.participation_level)}</small></div><div><button onclick="confirmReg(${r.id},'${r.participation_level}')">Подтвердить</button></div></div>`).join('')||'<div class="empty">Регистраций нет.</div>';const {data:students}=await sb.from('profiles').select('last_name,first_name,middle_name,student_group,rudn_email,balance,role').order('last_name');document.getElementById('students').innerHTML=(students||[]).map(s=>`<div class="history"><b>${esc(s.last_name)} ${esc(s.first_name)}</b><span>${s.balance} RDC</span><small>${esc(s.student_group)} · ${esc(s.role)}</small></div>`).join('')||'<div class="empty">Студентов нет.</div>'}
async function confirmReg(id,level){const {data:r}=await sb.from('registrations').select('*,events(base,title),profiles(id)').eq('id',id).single();if(!r||r.status==='confirmed')return;const mult={visitor:1,participant:1.15,active:1.30,presenter:1.50,winner:1.70}[level]||1;const base=r.events.base;const coins=Math.round(base*mult);const {error:e}=await sb.from('registrations').update({status:'confirmed',participation_level:level,coins_awarded:coins,confirmed_at:new Date().toISOString()}).eq('id',id);if(e)return alert(e.message);const {error:t}=await sb.from('coin_transactions').insert({student_id:r.student_id,amount:coins,kind:'event',description:`Участие: ${r.events.title}`,registration_id:id});if(t)return alert(t.message);await sb.rpc('refresh_balance',{p_student:r.student_id});await load()}
async function logout(){if(sb)await sb.auth.signOut();location.href='index.html'}
init();
</script></body></html>
